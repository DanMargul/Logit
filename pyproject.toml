[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logit"
version = "0.1.0"
description = "Prediction market quantitative engine and optimal transport stress testing"
requires-python = ">=3.13"
dependencies = [
    "polars",
    "numpy",
    "scipy"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["D"]
